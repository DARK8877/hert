<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ты прекрасна</title>

<!-- Запасной пиксельный шрифт с кириллицей (если Minecraft RUS не найден) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap&subset=cyrillic" rel="stylesheet">

<style>
  /* Положи файл шрифта рядом с этим HTML и назови его MinecraftRus.ttf
     (или поменяй имя/формат ниже: .otf, .woff, .woff2) */
  @font-face {
    font-family: 'Minecraft RUS';
    src: local('Minecraft RUS'), local('MinecraftRus'), local('Minecraft Rus'),
         url('MinecraftRus.ttf') format('truetype'),
         url('MinecraftRus.otf') format('opentype'),
         url('MinecraftRus.woff2') format('woff2'),
         url('MinecraftRus.woff') format('woff');
    font-display: swap;
  }

  :root {
    --cell: min(8.6vw, 5.4dvh);
    --c-dark: #4a0a0a;
    --c-dim:  #a81414;
    --c-red:  #e01a1a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--cell) * 1.2);
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    font-family: 'Minecraft RUS', 'Press Start 2P', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* ---------- Сердце ---------- */
  #heart {
    display: grid;
    grid-template-columns: repeat(9, var(--cell));
    grid-template-rows: repeat(10, var(--cell));
    cursor: pointer;
  }
  #heart.beat { animation: beat 1.2s ease-in-out infinite; }

  .px {
    width: var(--cell);
    height: var(--cell);
    transform: scale(0);
    opacity: 0;
  }
  .px.on { animation: pop .28s cubic-bezier(.2, 1.6, .4, 1) forwards; }

  @keyframes pop {
    0%   { transform: scale(0);   opacity: 0; }
    100% { transform: scale(1.02); opacity: 1; }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12%      { transform: scale(1.06); }
    24%      { transform: scale(1); }
    36%      { transform: scale(1.04); }
    48%      { transform: scale(1); }
  }

  /* ---------- Текст ---------- */
  #text {
    min-height: calc(var(--cell) * 1.6);
    font-size: min(7.2vw, 30px);
    line-height: 1.3;
    color: var(--c-red);
    text-shadow: .12em .12em 0 var(--c-dark);
    text-align: center;
    white-space: nowrap;
    letter-spacing: .02em;
  }
  #text span {
    display: inline-block;
    opacity: 0;
    transform: translateY(.5em) scale(.4);
  }
  #text span.on { animation: letter .25s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  @keyframes letter {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- Подсказка ---------- */
  #hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 6dvh);
    text-align: center;
    font-size: min(3.6vw, 14px);
    color: #6d1212;
    opacity: 0;
    transition: opacity .6s;
    pointer-events: none;
  }
  #hint.show { opacity: 1; animation: blink 1.4s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
</style>
</head>
<body>

<div id="heart" aria-label="Пиксельное сердце"></div>
<div id="text" aria-live="polite"></div>
<div id="hint">нажми на экран</div>

<script>
(() => {
  // . = пусто, D = тёмное, S = приглушённо-красное, R = ярко-красное
  const MAP = [
    "..DD.DD..",
    ".DRRDRRD.",
    "DRDRRRDRD",
    "DRDDRDDRD",
    "DRRDRDRRD",
    "DSRDRDRSD",
    ".DSRRRSD.",
    "..DSRSD..",
    "...DSD...",
    "....D...."
  ];
  const COLORS = { D: 'var(--c-dark)', S: 'var(--c-dim)', R: 'var(--c-red)' };
  const PHRASE = 'Ты прекрасна';

  const heart = document.getElementById('heart');
  const textEl = document.getElementById('text');
  const hint = document.getElementById('hint');

  let heartReady = false;
  let typing = false;

  // Собираем сетку
  const cells = [];
  MAP.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      const d = document.createElement('div');
      d.className = 'px';
      if (ch !== '.') {
        d.style.background = COLORS[ch];
        cells.push(d);
      }
      heart.appendChild(d);
    });
  });

  // Постепенное построение сердца: по строкам сверху вниз
  const STEP = 55;
  cells.forEach((c, i) => setTimeout(() => c.classList.add('on'), 400 + i * STEP));
  setTimeout(() => {
    heartReady = true;
    heart.classList.add('beat');
    hint.classList.add('show');
  }, 400 + cells.length * STEP + 300);

  // Печать текста по буквам
  function buildText() {
    typing = true;
    hint.classList.remove('show');
    textEl.innerHTML = '';
    const spans = [...PHRASE].map(ch => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      textEl.appendChild(s);
      return s;
    });
    spans.forEach((s, i) => setTimeout(() => s.classList.add('on'), i * 150));
    setTimeout(() => {
      typing = false;
      if (navigator.vibrate) navigator.vibrate(30);
    }, spans.length * 150 + 300);
  }

  document.addEventListener('pointerdown', () => {
    if (!heartReady || typing) return;
    buildText();
  });
})();
</script>
</body>
</html>
